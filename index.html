let lang=localStorage.getItem?null:null;try{lang=localStorage.getItem('lang')}catch(e){}
lang=lang||'ar';
let S={view:'start',qs:[],i:0,a:[]};
const $=id=>document.getElementById(id);
const t=k=>T[lang][k];
const pick=s=>{const p=s.split('|');return p.length>1?(lang==='ar'?p[0]:p[1]):s};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){S.qs=D.map(d=>({l:d[0],q:d[1],o:shuf([0,1,2,3].map(k=>({t:d[2+k],c:k===0})))}));S.qs=shuf(S.qs);S.a=S.qs.map(()=>-1);S.i=0}
function setLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('brand').textContent=t('brand');$('lang').textContent=t('lang');try{localStorage.setItem('lang',lang)}catch(e){}}
$('lang').onclick=()=>{lang=lang==='ar'?'en':'ar';setLang();render()};
const ltr=['A','B','C','D'],ar=['أ','ب','ج','د'];
const lt=k=>lang==='ar'?ar[k]:ltr[k];
function render(){const m=$('app');
if(S.view==='start'){m.innerHTML=`<div class="card hero"><h1>${t('title')}</h1><p>${t('sub')}</p><div class="chips"><span class="chip">${D.length} ${t('q')}</span><span class="chip">${t('all')}</span><span class="chip">AR / EN</span></div><button class="btn" id="go">${t('start')}</button></div>`;$('go').onclick=()=>{build();S.view='quiz';render()};return}
if(S.view==='quiz'){const q=S.qs[S.i],n=S.qs.length,done=S.a.filter(x=>x>=0).length;
m.innerHTML=`<div class="bar"><i style="width:${done/n*100}%"></i></div><div class="card"><div class="meta"><span>${S.i+1} ${t('of')} ${n}</span><span>${pick(L[q.l])}</span></div><div class="q">${pick(q.q)}</div>${q.o.map((o,k)=>`<button class="opt ${S.a[S.i]===k?'sel':''}" data-k="${k}"><b>${lt(k)}</b><span>${pick(o.t)}</span></button>`).join('')}<div class="nav"><button class="btn sec" id="pv" ${S.i?'':'disabled'}>${t('prev')}</button>${S.i<n-1?`<button class="btn" id="nx">${t('next')}</button>`:`<button class="btn" id="fn">${t('fin')}</button>`}</div></div><div class="dots">${S.qs.map((_,k)=>`<button data-j="${k}" class="${k===S.i?'cur':S.a[k]>=0?'ans':''}">${k+1}</button>`).join('')}</div><p class="meta">${done}/${n} ${t('ans')}</p>`;
m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.a[S.i]=+b.dataset.k;render()});
m.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;render()});
$('pv').onclick=()=>{S.i--;render()};
if($('nx'))$('nx').onclick=()=>{S.i++;render()};
if($('fn'))$('fn').onclick=()=>{if(S.a.includes(-1)&&!confirm(t('unans')))return;S.view='res';render()};
scrollTo(0,0);return}
const n=S.qs.length,ok=S.qs.filter((q,i)=>S.a[i]>=0&&q.o[S.a[i]].c).length,p=Math.round(ok/n*100);
const msg=p>=90?t('perf'):p>=75?t('good'):p>=50?t('mid'):t('low');
const by=L.map((l,li)=>{const x=S.qs.map((q,i)=>[q,i]).filter(([q])=>q.l===li),c=x.filter(([q,i])=>S.a[i]>=0&&q.o[S.a[i]].c).length;return`<div class="row"><span style="min-width:150px">${pick(l)}</span><div class="bar"><i style="width:${c/x.length*100}%"></i></div><b>${c}/${x.length}</b></div>`}).join('');
const wr=S.qs.map((q,i)=>[q,i]).filter(([q,i])=>!(S.a[i]>=0&&q.o[S.a[i]].c));
m.innerHTML=`<div class="card"><h2 style="margin-top:0">${t('res')}</h2><div class="score"><div class="ring" style="--p:${p}"><span>${p}%</span></div><div><b style="font-size:1.4rem">${ok} / ${n}</b><div>${msg}</div></div></div><div style="margin-top:18px">${by}</div><div class="nav" style="justify-content:flex-start"><button class="btn" id="rt">${t('again')}</button></div></div><h3>${t('rv')}</h3>${wr.length?wr.map(([q,i])=>`<div class="rev"><b>${pick(q.q)}</b><br><small>${t('yours')}:</small> ${S.a[i]>=0?pick(q.o[S.a[i]].t):t('none')}<br><small>${t('right')}:</small> <b style="color:var(--ok)">${pick(q.o.find(o=>o.c).t)}</b></div>`).join(''):`<div class="rev g">${t('perfect')}</div>`}`;
$('rt').onclick=()=>{S.view='start';render()};scrollTo(0,0)}
setLang();render();
</script>
</body>
